<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact Us </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <style>
        .b-form {
            border: 1px solid black;
            border-radius: 10px;
            width: 600px
        }
    </style>

    <div class="container d-flex justify-content-center align-items-center  ">

        <div class=" container w-100 mt-4  b-form " style="max-width: 500px;">

            <h2 class="text-center mt-4 mb-4">Contact Us</h2>

            <form onsubmit="return validate()">

                <div class=" mb-3">
                    <label class="form-label">Name:</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Your name">
                    <span class="text-danger" id="nameError"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <input type="text" id="email" name="email" class="form-control" placeholder="Your email">
                    <span class="text-danger" id="emailError"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mobile Number:</label>
                    <input type="tel" id="mobile" name="mobile" class="form-control" placeholder="Your mobile number">
                    <span class="text-danger" id="mobileError"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password:</label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter password">
                    <span class="text-danger" id="passwordError"></span>

                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password:</label>
                    <input type="password" id="confirmpassword" name="confirmPassword" class="form-control"
                        placeholder="Confirm password">
                    <span class="text-danger" id="confirmpasswordError"></span>

                </div>

                <div class="mb-3">
                    <label class="form-label">Message:</label>
                    <textarea class="form-control" id="message" name="message" placeholder="Your message"></textarea>
                    <span class="text-danger" id="messageError"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label">Gender:</label>

                    <div>
                        <input type="radio" id="male" name="gender"> Male
                        <input type="radio" id="female" name="gender" class="ms-3"> Female
                        <input type="radio" id="other" name="gender" class="ms-3"> Other
                        <span class="text-danger" id="genderError"></span>
                    </div>
                </div>

                <div class="mb-3">
                    <input type="checkbox" id="agree" name="agree">
                    I agree to the terms & conditions
                    <span class="text-danger" id="agreeError"></span>
                </div>

                <button type="submit" class="btn btn-primary  mb-4 w-100">
                    Submit
                </button>

            </form>

        </div>

    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script>
        function validate() {

            const name = document.getElementById("name").value.trim();

            const email = document.getElementById("email").value.trim();

            const mobile = document.getElementById("mobile").value.trim();

            const password = document.getElementById("password").value.trim();

            const confirmpassword = document.getElementById("confirmpassword").value.trim();

            const message = document.getElementById("message").value.trim();

            const gender = document.querySelector('input[name="gender"]:checked')

            const agree = document.getElementById("agree").checked;

            const nameError = document.getElementById("nameError");
            const emailError = document.getElementById("emailError");
            const mobileError = document.getElementById("mobileError");
            const passwordError = document.getElementById("passwordError");
            const confirmPasswordError = document.getElementById("confirmpasswordError");
            const messageError = document.getElementById("messageError");
            const genderError = document.getElementById("genderError");
            const agreeError = document.getElementById("agreeError");




            nameError.textContent = "";
            emailError.textContent = "";
            passwordError.textContent = "";
            mobileError.textContent = "";
            confirmPasswordError.textContent = "";
            messageError.textContent = "";
            genderError.textContent = "";
            agreeError.textContent = "";
        }

        // Clear previous error message



        //validate field

        let isvalid = true;


        if (name === "") {
            nameError.textContent = "Please enter your name.";
            isvalid = false;
        }
        else if (name.length < 3) {
            nameError.textContent = "Please enter at least 3 characters.";
            isvalid = false;
        }


        if (email === "") {
            emailError.textContent = "Please enter your email.";
            isvalid = false;
        }
        else if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) {
            emailError.textContent = "Please enter a valid email address.";
            isvalid = false;
        }


        if (mobile === "") {
            mobileError.textContent = "Please enter your mobile number.";
            isvalid = false;
        }
        else if (!/^[6-9][0-9]{9}$/.test(mobile)) {
            mobileError.textContent = "Please enter a valid 10-digit mobile number.";
            isvalid = false;
        }

        if (password === "") {
            passwordError.textContent = "Please enter your password.";
            isvalid = false;
        }
        else if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@#$%^&+=!]).{8,}$/.test(password)) {
            passwordError.textContent = "Password must contain 8 characters, uppercase, lowercase, number and special character.";
            isvalid = false;
        }

        if (confirmPassword === "") {
            confirmPasswordError.textContent = "Please confirm your password.";
            isvalid = false;
        }
        else if (confirmpassword !== password) {
            confirmPasswordError.textContent = "Passwords do not match.";
            isvalid = false;
        }

        if (message === "") {
            messageError.textContent = "Please enter your Message.";
            isvalid = false;
        }

        if (!gender) {
            genderError.textContent = "Please select you gender.";
            isvalid = false;


        }


        if (!agree) {
            agreeError.textContent = "You miust agree the terms and conditions ";
            isvalid = false;

        }

        if (isvalid) {
            alert("Form Is Submitted Successfully")
        }

        return isvalid();

    </script>



</body>

</html>
